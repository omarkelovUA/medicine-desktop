<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2bc0b4"/>
      <stop offset="1" stop-color="#1769aa"/>
    </linearGradient>
    <linearGradient id="capRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#d63031"/>
    </linearGradient>
    <linearGradient id="capWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe6ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0b2a44" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#bg)"/>
  <rect x="12" y="12" width="232" height="116" rx="52" fill="#ffffff" opacity="0.08"/>

  <!-- calendar page -->
  <g filter="url(#shadow)">
    <rect x="46" y="56" width="164" height="150" rx="20" fill="#ffffff"/>
    <path d="M66 56 h124 a20 20 0 0 1 20 20 v20 h-164 v-20 a20 20 0 0 1 20 -20 z" fill="#e8505b"/>
  </g>
  <!-- rings -->
  <rect x="82" y="40" width="14" height="34" rx="7" fill="#f4f7fb" stroke="#0f4c75" stroke-width="3"/>
  <rect x="160" y="40" width="14" height="34" rx="7" fill="#f4f7fb" stroke="#0f4c75" stroke-width="3"/>
  <!-- day grid dots -->
  <g fill="#cfd9e4">
    <circle cx="72" cy="120" r="7"/><circle cx="100" cy="120" r="7"/><circle cx="128" cy="120" r="7"/>
    <circle cx="156" cy="120" r="7"/><circle cx="184" cy="120" r="7"/>
    <circle cx="72" cy="148" r="7"/><circle cx="100" cy="148" r="7"/>
    <circle cx="72" cy="176" r="7"/>
  </g>
  <!-- taken: green check on first days -->
  <g fill="none" stroke="#27ae60" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M65 120 l5 5 l9 -10"/>
    <path d="M93 120 l5 5 l9 -10"/>
  </g>

  <!-- capsule -->
  <g transform="rotate(-38 150 160)" filter="url(#shadow)">
    <path d="M150 136 h-38 a24 24 0 0 0 0 48 h38 z" fill="url(#capRed)"/>
    <path d="M150 136 h38 a24 24 0 0 1 0 48 h-38 z" fill="url(#capWhite)"/>
    <rect x="96" y="141" width="80" height="7" rx="3.5" fill="#ffffff" opacity="0.45"/>
    <rect x="88" y="136" width="124" height="48" rx="24" fill="none" stroke="#0f4c75" stroke-opacity="0.25" stroke-width="2"/>
  </g>

  <!-- family heart badge -->
  <g filter="url(#shadow)">
    <circle cx="200" cy="200" r="30" fill="#ffffff"/>
    <path d="M200 216 C 182 203, 180 192, 186 186 C 191 181, 198 183, 200 189 C 202 183, 209 181, 214 186 C 220 192, 218 203, 200 216 Z" fill="#e8505b"/>
  </g>
</svg>
