google.setup.text=Щоб синхронізувати ліки з Google Календарем, потрібен файл OAuth-клієнта Google. Його створюють один раз для всієї родини:\n\n1. Відкрийте Google Cloud Console і створіть проєкт.\n2. APIs & Services → Library → увімкніть Google Calendar API.\n3. OAuth consent screen: тип External; додайте акаунти родини в Test users або натисніть Publish app.\n4. Credentials → Create credentials → OAuth client ID → тип «Desktop app».\n5. Завантажте JSON-файл і виберіть його тут.
